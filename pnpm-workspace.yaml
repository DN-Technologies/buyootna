  expo-modules-core: ~3.0.30
  '@expo/metro-runtime': 6.1.2
  react: 19.1.0
  react-dom: 19.1.0
  react-native: 0.81.5

patchedDependencies:
  react-native@0.81.5: patches/react-native@0.81.5.patch
