packages:
  - "apps/*"
  - "apps/web/*"
  - "packages/*"
allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
