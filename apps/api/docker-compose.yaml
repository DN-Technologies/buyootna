
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buyootna-api
    restart: always
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Environment variables are automatically loaded from .env due to env_file,
      # but we can also explicitly list them here for visibility/interpolation
      - PORT=${PORT:-8000}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-super-secret-fallback-key}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
