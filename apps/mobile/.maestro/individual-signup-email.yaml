appId: com.constyoussef.buyootna
---
# Guest -> account-type selection -> individual auth (signup tab) -> email
# signup (no OTP needed) -> success sheet -> lands on individual home.
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "لا توجد عقارات"
    timeout: 15000
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
- tapOn:
    point: "10%, 93%" # "المزيد" tab (bottom-left in this RTL layout)
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "10%, 93%"
- extendedWaitUntil:
    visible: "إنشاء حساب"
    timeout: 10000
- tapOn: "إنشاء حساب"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: "50%, 40%" # the "فرد" account-type card
- tapOn: "بدء التسجيل"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "تسجيل جديد"
- tapOn:
    point: "50%, 34%" # identifier field
- inputText: "maestro-signup@buyootna.test"
- tapOn:
    id: "individual-signup-password-input"
- inputText: "MaestroE2E123!"
- tapOn:
    id: "individual-signup-confirm-password-input"
- inputText: "MaestroE2E123!"
- tapOn: "تأكيد كلمة المرور" # tap the label (not a field) to dismiss the keyboard
- tapOn: "إنشاء حساب"
# The success sheet's own content isn't exposed to iOS's accessibility tree
# (a @gorhom/bottom-sheet + Fabric quirk: the sheet's backdrop correctly
# hides the screen behind it, but the sheet's own text/buttons never surface
# either — see SuccessBottomSheet.tsx), so `visible`/`tapOn` by text never
# resolves once it's open even though it's plainly on screen. Use the
# backdrop hiding the submit button as the "sheet is open" signal instead,
# then tap its button by position.
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    notVisible: "إنشاء حساب"
    timeout: 15000
- tapOn:
    point: "50%, 93%" # "ابدأ الآن" button inside the success sheet
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 10000
