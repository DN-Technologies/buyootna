appId: com.constyoussef.buyootna
---
# Guest -> account-type selection -> individual auth (signup tab) -> email
# signup -> OTP verification (no account exists until this succeeds) ->
# success sheet -> lands on individual home.
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "لا توجد عقارات"
    timeout: 15000
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
- tapOn:
    point: "10%, 93%" # "المزيد" tab (bottom-left in this RTL layout)
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "10%, 93%"
- extendedWaitUntil:
    visible: "إنشاء حساب"
    timeout: 10000
- tapOn: "إنشاء حساب"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: "50%, 40%" # the "فرد" account-type card
- tapOn: "بدء التسجيل"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "تسجيل جديد"
- tapOn:
    id: "individual-signup-name-input"
- inputText: "Maestro Test"
- tapOn:
    id: "individual-signup-identifier-input"
- inputText: "maestro-signup@buyootna.test"
- tapOn:
    id: "individual-signup-password-input"
# Two adjacent secureTextEntry fields with textContentType="newPassword"
# make iOS Simulator's strong-password autofill suggestion insert a
# generated value into a password field before we ever type into it (this
# is what previously broke tapping these fields entirely — see
# IndividualSignupForm.tsx) — it's non-deterministic (tied to the
# simulator's iCloud/Keychain state), so erase first rather than typing on
# top of whatever autofill may have inserted.
- eraseText
- inputText: "MaestroE2E123!"
- tapOn:
    id: "individual-signup-confirm-password-input"
- eraseText
- inputText: "MaestroE2E123!"
# Tapping the confirm-password label to dismiss the keyboard (as the
# password fields' fix did) stopped being reliable once the form grew a
# 4th field: with the keyboard still up there isn't enough room to show
# both the label and the submit button, so neither is reliably reachable
# by a position-based tap. hideKeyboard's iOS scroll-based dismiss works
# here (unlike on the OTP screen's custom hidden input) since this is a
# standard, visible TextInput.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "إنشاء حساب"
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible: "تحقق من الرمز"
    timeout: 15000
- runScript: scripts/fetch-email-otp.js
- tapOn:
    id: "individual-signup-otp-boxes"
- inputText: ${output.otp}
# The 6th digit auto-dismisses the keyboard (IndividualSignupOtpStep calls
# Keyboard.dismiss() once the value hits length 6), which lets this
# KeyboardAvoidingView-wrapped button settle back to its rest position
# before we tap it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "التحقق من الرمز"
# The success sheet's own content isn't exposed to iOS's accessibility tree
# (a @gorhom/bottom-sheet + Fabric quirk: the sheet's backdrop correctly
# hides the screen behind it, but the sheet's own text/buttons never surface
# either — see SuccessBottomSheet.tsx), so `visible`/`tapOn` by text never
# resolves once it's open even though it's plainly on screen. Use the
# backdrop hiding the verify button as the "sheet is open" signal instead,
# then tap its button by position.
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    notVisible: "التحقق من الرمز"
    timeout: 15000
- tapOn:
    point: "50%, 93%" # "ابدأ الآن" button inside the success sheet
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 10000
