appId: com.constyoussef.buyootna
---
# Verifies the fix for the reported High-severity bug: "Changing password
# incorrectly requires a phone number, blocking the update." An account
# with no phone on file (email/social-login only) could never change its
# password -- the app always requested a phone OTP first, and the backend
# always rejected that with "المستخدم ليس لديه رقم هاتف مسجل" since
# there's no phone to send it to. Now a phone-less account changes its
# password directly with just the old password -- the OTP request and
# verification sheet must never appear at all.
#
# Flow: seed an email-only account -> log in -> More -> Account Settings ->
# Change Password -> submit old/new password -> assert no OTP sheet ever
# appears -> assert the success alert -> verify via direct API that the
# password actually changed (old rejected, new accepted).
- runScript: scripts/seed-change-password-account.js
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "المزيد"
    timeout: 20000
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
- tapOn: "المزيد"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
- tapOn: "المزيد"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
# The "تسجيل الدخول" button sits below the fold on the guest More screen
# (unlike "إنشاء حساب", which is visible without scrolling) — scroll it
# into view before tapping.
- scrollUntilVisible:
    element:
      text: "تسجيل الدخول"
    direction: DOWN
    timeout: 10000
    waitToSettleTimeoutMs: 500
- tapOn: "تسجيل الدخول"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    id: "individual-login-identifier-input"
- waitForAnimationToEnd:
    timeout: 2000
- eraseText
- inputText: ${output.email}
- tapOn:
    id: "individual-login-password-input"
- waitForAnimationToEnd:
    timeout: 2000
- eraseText
- inputText: ${output.oldPassword}
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ${output.email}
- tapOn: "تسجيل الدخول"
# iOS Simulator's keychain "Save Password?" dialog after a successful
# login is environmental/unrelated to app UI, just needs dismissing.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 15000

# Now authenticated -- go to Account Settings -> Change Password.
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
- tapOn: "المزيد"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      # MenuItem rows auto-compose an accessibility label from their
      # children (icon + title + chevron), landing on "<title>, " with a
      # trailing comma -- Maestro's plain-text selectors require a full
      # match, so an exact "اعدادات الحساب" never matches. Same reasoning
      # applies to every other MenuItem tap below.
      text: "اعدادات الحساب.*"
    direction: DOWN
    timeout: 10000
    waitToSettleTimeoutMs: 500
- tapOn: "اعدادات الحساب.*"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "تغيير كلمة المرور.*"
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "change-password-old-input"
- inputText: ${output.oldPassword}
- tapOn:
    id: "change-password-new-input"
- inputText: ${output.newPassword}
- tapOn:
    id: "change-password-confirm-input"
- inputText: ${output.newPassword}
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "تحديث كلمة المرور"

# The critical assertion for this bug: this account has no phone, so the
# OTP verification sheet must NEVER appear -- the change must complete
# directly from a single submit.
- extendedWaitUntil:
    notVisible: "تحقق من الرقم"
    timeout: 3000
- extendedWaitUntil:
    visible: ".*تم تغيير كلمة المرور بنجاح.*"
    timeout: 15000
# The success alert's own content isn't exposed to iOS's accessibility
# tree as separate elements (title/message/button all collapse into one
# combined, full-screen-bounded node) -- same quirk documented in
# forgot-password-email.yaml. Tap the "موافق" button by its on-screen
# position instead of by text.
- tapOn:
    point: "50%, 54%"

- runScript: scripts/verify-change-password-took-effect.js
