appId: com.constyoussef.buyootna
---
# Verifies the fix for the Critical bug: "OTP is not delivered during the
# Forgot Password flow" for an email-only account. Before the fix,
# RecoveryService.requestOtp only ever sent an OTP over Twilio SMS, gated
# on user.phone -- an email-registered account (no phone on file) silently
# received nothing while the API still reported success, permanently
# blocking recovery. fetch-recovery-otp.js fails this flow outright if no
# OTP was actually sent, rather than masking it.
#
# Flow: seed an email-only account -> Guest More tab -> Login -> "forgot
# password?" -> request OTP -> read the (mock) delivered OTP -> verify it
# -> set a new password -> log back in with the NEW password to prove the
# whole loop actually took effect.
- runScript: scripts/seed-forgot-password-account.js
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "المزيد"
    timeout: 20000
- tapOn:
    text: "Open debugger to view warnings.*"
    optional: true
- tapOn:
    point: "10%, 93%" # "المزيد" tab (bottom-left in this RTL layout)
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "10%, 93%"
- waitForAnimationToEnd:
    timeout: 3000
# The "تسجيل الدخول" button sits below the fold on the guest More screen
# (unlike "إنشاء حساب", which is visible without scrolling) — scroll it
# into view before tapping.
- scrollUntilVisible:
    element:
      text: "تسجيل الدخول"
    direction: DOWN
    timeout: 10000
- tapOn: "تسجيل الدخول"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "هل نسيت كلمة المرور؟"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "forgot-password-identifier-input"
- inputText: ${output.email}
- hideKeyboard
- tapOn: "إرسال رمز التحقق"
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible: "تحقق من الرمز"
    timeout: 15000
- runScript: scripts/fetch-recovery-otp.js
- tapOn:
    id: "forgot-password-otp-boxes"
- inputText: ${output.resetOtp}
# Unlike the signup OTP step, ForgotPasswordStep2 never calls
# Keyboard.dismiss() itself, so the keyboard stays up and can cover/shift
# the submit button. The hidden hardware-keyboard-driven input here isn't
# a standard TextInput Maestro's hideKeyboard can dismiss (it fails with
# "Couldn't hide the keyboard") -- tap a static, non-interactive element
# instead, per Maestro's own suggested workaround. (Not the screen title
# "تحقق من الرمز" -- it's a substring of the submit button's "التحقق من
# الرمز" and would be an ambiguous match.)
- tapOn:
    text: "إعادة إرسال الرمز خلال.*"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "التحقق من الرمز"
- extendedWaitUntil:
    visible: "إنشاء كلمة مرور جديدة"
    timeout: 20000
- tapOn:
    id: "forgot-password-new-password-input"
- inputText: "MaestroNewPass456!"
- tapOn:
    id: "forgot-password-confirm-password-input"
- inputText: "MaestroNewPass456!"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "تحديث كلمة المرور"
- waitForAnimationToEnd:
    timeout: 10000
# The success sheet's own content isn't exposed to iOS's accessibility
# tree (see SuccessBottomSheet.tsx / individual-signup-email.yaml for the
# same @gorhom/bottom-sheet quirk) -- use the backdrop hiding the update
# button as the "sheet is open" signal, then tap its button by position.
- extendedWaitUntil:
    notVisible: "تحديث كلمة المرور"
    timeout: 15000
- tapOn:
    point: "50%, 93%" # "تسجيل الدخول" button inside the success sheet
- waitForAnimationToEnd:
    timeout: 10000
# Back on the login screen -- log in with the NEW password to prove the
# reset actually took effect end-to-end, not just that the API returned
# 201 somewhere along the way.
- extendedWaitUntil:
    visible: "تسجيل جديد"
    timeout: 10000
- tapOn:
    id: "individual-login-identifier-input"
- inputText: ${output.email}
- tapOn:
    id: "individual-login-password-input"
- eraseText
- inputText: "MaestroNewPass456!"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "تسجيل الدخول"
# iOS Simulator's keychain "Save Password?" dialog after a successful
# login is environmental/unrelated to app UI, just needs dismissing.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 15000
