plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.storyvideoeditor'
version = '1.0.0'

android {
  namespace "expo.modules.storyvideoeditor"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The same media3 as expo-video (node_modules/expo-video/android/build.gradle)
  def androidxMedia3Version = "1.8.0"
  implementation "androidx.media3:media3-transformer:${androidxMedia3Version}"
  implementation "androidx.media3:media3-effect:${androidxMedia3Version}"
  implementation "androidx.media3:media3-common:${androidxMedia3Version}"
}
