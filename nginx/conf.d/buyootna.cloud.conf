server {
    listen 80;
    listen [::]:80;
    server_name buyootna.cloud www.buyootna.cloud;

    # Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name buyootna.cloud www.buyootna.cloud;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/buyootna.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buyootna.cloud/privkey.pem;

    # Include recommended TLS parameters (downloaded by init-letsencrypt.sh)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Use Docker's internal DNS so nginx can start even if 'buyootna-landing' isn't running yet
    resolver 127.0.0.11 valid=30s;

    # Proxy to Next.js Landing Page
    location / {
        set $upstream http://buyootna-landing:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
