server {
    listen 80;
    listen [::]:80;
    server_name api.daralnokhba.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.daralnokhba.online;

    ssl_certificate /etc/letsencrypt/live/api.daralnokhba.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daralnokhba.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream http://dar-alnokhba-api:8100;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
