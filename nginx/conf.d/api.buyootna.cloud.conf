server {
    listen 80;
    listen [::]:80;
    server_name api.buyootna.cloud;

    # Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.buyootna.cloud;

    # SSL Certificates (managed by Certbot)
    # These files are created by init-letsencrypt.sh (dummy first, then real)
    ssl_certificate /etc/letsencrypt/live/api.buyootna.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.buyootna.cloud/privkey.pem;

    # Include recommended TLS parameters (downloaded by init-letsencrypt.sh)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Proxy to NestJS API
    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
