services:
  nginx:
    image: nginx:alpine
    restart: always
    ports: ["80:80", "443:443"]
    networks: [default, edge]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose: ["8000"]
    env_file:
      - ./apps/api/.env
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ./.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose: ["5432"]

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./.env.postgres
    environment:
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      POSTGRES_HOST: postgres
    volumes:
      - ./backups/postgres:/backups

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  web-landing:
    build:
      context: .
      dockerfile: apps/web/landing/Dockerfile
    expose: ["3001"]
    restart: always

  web-companies:
    build:
      context: .
      dockerfile: apps/web/companies/Dockerfile
    expose: ["3002"]
    restart: always

  web-offices:
    build:
      context: .
      dockerfile: apps/web/offices/Dockerfile
    expose: ["3003"]
    restart: always

  web-management:
    build:
      context: .
      dockerfile: apps/web/management/Dockerfile
    expose: ["3004"]
    restart: always

  web-admin:
    build:
      context: .
      dockerfile: apps/web/admin/Dockerfile
    expose: ["3005"]
    restart: always

  web-docs:
    build:
      context: .
      dockerfile: apps/web/docs/Dockerfile
    expose: ["3006"]
    restart: always

  marketing:
    build:
      context: ./apps/marketing
    expose: ["7000"]
    restart: always

volumes:
  postgres_data:
networks:
  edge:
    external: true
