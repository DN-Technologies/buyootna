services:
  nginx:
    image: nginx:alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks: [default, edge]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Shown on the testing portal (الحالة / المزيد); CD exports both
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    expose: ["8000"]
    env_file:
      - ./apps/api/.env
    volumes:
      # MaxMind GeoLite2 database for device locations; kept across deploys
      # and refreshed weekly by the API (needs MAXMIND_* in apps/api/.env)
      - geoip_data:/app/apps/api/data/geoip
    restart: always
    depends_on:
      - postgres

  postgres:
    # Neon's version, so its dump loads as is (scripts/migrate-from-neon.sh).
    # Its own volume: postgres_data holds the old postgres:16 cluster, which
    # this image can't start on; it's kept untouched (and dumped to backups/
    # by that script)
    image: postgres:17-alpine
    restart: always
    env_file:
      - ./.env.postgres
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    expose: ["5432"]

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./.env.postgres
    environment:
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      POSTGRES_HOST: postgres
    volumes:
      - ./backups/postgres:/backups

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  web-landing:
    build:
      context: .
      dockerfile: apps/web/landing/Dockerfile
    expose: ["3001"]
    restart: always

  web-companies:
    build:
      context: .
      dockerfile: apps/web/companies/Dockerfile
    expose: ["3002"]
    restart: always

  web-offices:
    build:
      context: .
      dockerfile: apps/web/offices/Dockerfile
    expose: ["3003"]
    restart: always

  web-management:
    build:
      context: .
      dockerfile: apps/web/management/Dockerfile
    expose: ["3004"]
    restart: always

  web-admin:
    build:
      context: .
      dockerfile: apps/web/admin/Dockerfile
    expose: ["3005"]
    restart: always

  web-docs:
    build:
      context: .
      dockerfile: apps/web/docs/Dockerfile
    expose: ["3006"]
    environment:
      # Server-to-server: the docs site signs people in through the API
      API_URL: http://api:8000
    # DOCS_JWT_SECRET (same value as in apps/api/.env). Without it the site
    # stays locked, so a missing file doesn't stop the stack from starting.
    env_file:
      - path: ./apps/web/docs/.env
        required: false
    restart: always

  web-testing:
    build:
      context: .
      dockerfile: apps/web/testing/Dockerfile
    expose: ["3007"]
    environment:
      # Server-to-server: the testing site signs testers in through the API
      API_URL: http://api:8000
    # TESTING_JWT_SECRET (same value as in apps/api/.env). Without it the
    # site stays locked, so a missing file doesn't stop the stack.
    env_file:
      - path: ./apps/web/testing/.env
        required: false
    restart: always

  marketing:
    build:
      context: ./apps/marketing
    expose: ["7000"]
    restart: always

volumes:
  # The old postgres:16 cluster: no longer mounted, kept as it was
  postgres_data:
  postgres17_data:
  geoip_data:

networks:
  # Shared with the dar-alnokhba stack on this host so nginx can reach its
  # containers by name (dar-alnokhba's docker-compose.yaml joins the same
  # network). One-time host setup: docker network create edge
  edge:
    external: true
