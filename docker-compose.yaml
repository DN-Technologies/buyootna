services:
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  api:
    build: ./apps/api
    expose: ["8000"]
    env_file:
      - ./apps/api/.env
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  web-landing:
    build:
      context: .
      dockerfile: apps/web/landing/Dockerfile
    expose: ["3001"]
    restart: always

  web-companies:
    build:
      context: .
      dockerfile: apps/web/companies/Dockerfile
    expose: ["3002"]
    restart: always

  web-offices:
    build:
      context: .
      dockerfile: apps/web/offices/Dockerfile
    expose: ["3003"]
    restart: always

  web-management:
    build:
      context: .
      dockerfile: apps/web/management/Dockerfile
    expose: ["3004"]
    restart: always

  web-admin:
    build:
      context: .
      dockerfile: apps/web/admin/Dockerfile
    expose: ["3005"]
    restart: always