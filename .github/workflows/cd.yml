name: CD Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # The build + backup + migrate + restart script takes ~10 min and
          # the action's default 10m timeout killed a deploy mid-build. A
          # cold rebuild of every image one at a time (below) can take
          # longer, so allow an hour.
          command_timeout: 60m
          script: |
            set -e
            cd ${{ secrets.TARGET_DIR }}
            git pull origin main
            # The API image records which build it is (testing portal)
            export GIT_SHA=$(git rev-parse --short HEAD)
            export BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # Build images one service at a time. A plain `docker compose
            # build` (Bake) builds all of them in parallel; after a lockfile
            # change that's 6 cold Next.js builds + nest at once, which used
            # all 7.8 GiB of RAM on this box (no swap), froze it and took
            # production down (2026-10-06). Services without a build section
            # are no-ops.
            for service in $(docker compose config --services); do
              docker compose build "$service"
            done
            docker compose up -d postgres postgres-backup
            docker compose exec -T postgres-backup /backup.sh
            BASELINE_MIGRATION="20260819132243_sync_schema_baseline"
            set +e
            MIGRATE_OUTPUT=$(docker compose run --rm api npx prisma migrate deploy --schema=prisma 2>&1)
            MIGRATE_EXIT_CODE=$?
            set -e
            if [ $MIGRATE_EXIT_CODE -ne 0 ]; then
              if echo "$MIGRATE_OUTPUT" | grep -q "Error: P3009" && echo "$MIGRATE_OUTPUT" | grep -q "$BASELINE_MIGRATION"; then
                echo "$MIGRATE_OUTPUT"
                echo "Detected failed baseline migration history. Marking baseline as applied and retrying deploy migration."
                docker compose run --rm api npx prisma migrate resolve --applied "$BASELINE_MIGRATION" --schema=prisma
                docker compose run --rm api npx prisma migrate deploy --schema=prisma
              else
                echo "$MIGRATE_OUTPUT"
                exit $MIGRATE_EXIT_CODE
              fi
            fi
            docker compose up -d
            docker system prune -f
